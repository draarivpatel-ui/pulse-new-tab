<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pulse - a custom new-tab page with a live clock, quick links, and NASA's Astronomy Picture of the Day.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b14">
  <title>Pulse - New Tab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070b14'/%3E%3Cpath d='M50 12 Q50 50 88 50 Q50 50 50 88 Q50 50 12 50 Q50 50 50 12 Z' fill='%237cf5c8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>

  <header class="topbar">
    <span class="wordmark" aria-hidden="true">&#10022; Pulse</span>
    <button class="icon-btn" id="settings-btn" type="button" aria-haspopup="dialog" aria-label="Open settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 8h16M15 5.5v5M4 16h16M9 13.5v5"/>
      </svg>
    </button>
  </header>

  <main class="page">
    <h1 class="greeting" id="greeting">Welcome back, Aariv</h1>

    <p class="clock" id="clock" role="timer" aria-label="Current time">
      <span id="clock-time">--:--</span>
      <span class="clock-meta">
        <span id="clock-meridiem"></span>
        <span id="clock-seconds" aria-hidden="true"></span>
      </span>
    </p>

    <p class="date" id="date">&nbsp;</p>

    <figure class="quote" aria-label="Quote of the day">
      <blockquote class="quote-text" id="quote-text"></blockquote>
      <figcaption class="quote-author" id="quote-author"></figcaption>
    </figure>

    <form class="search" id="search-form" action="https://www.google.com/search" method="get" role="search">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <label class="visually-hidden" for="search-input">Search Google</label>
      <input id="search-input" name="q" type="search" placeholder="Search Google" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </form>

    <nav class="links" aria-label="Quick links">
      <ul class="link-grid" id="link-grid"></ul>
    </nav>
  </main>

  <aside class="apod" id="apod" hidden>
    <img class="apod-thumb" id="apod-thumb" alt="" width="64" height="64">
    <div class="apod-info">
      <p class="apod-label">NASA &middot; Picture of the day</p>
      <h2 class="apod-title" id="apod-title"></h2>
      <p class="apod-note" id="apod-note" role="status"></p>
    </div>
    <button class="btn" id="apod-open" type="button">View</button>
  </aside>

  <footer class="hints" aria-hidden="true">
    <span><kbd>/</kbd> search</span>
    <span aria-hidden="true">&middot;</span>
    <span><kbd>N</kbd> add link</span>
    <span aria-hidden="true">&middot;</span>
    <span><kbd>T</kbd> 12/24h</span>
  </footer>

  <!-- Settings -->
  <dialog class="dialog" id="settings-dialog" aria-labelledby="settings-heading">
    <h2 id="settings-heading">Settings</h2>
    <form id="settings-form" novalidate>
      <div class="field">
        <label for="setting-name">Display name</label>
        <input id="setting-name" type="text" maxlength="40" autocomplete="off" spellcheck="false">
      </div>
      <label class="check">
        <input type="checkbox" id="setting-24h">
        Use 24-hour clock
      </label>
      <label class="check">
        <input type="checkbox" id="setting-seconds">
        Show seconds on the clock
      </label>
      <label class="check">
        <input type="checkbox" id="setting-apod">
        Show NASA picture of the day
      </label>
      <div class="settings-links">
        <p class="settings-subhead" id="links-heading">Quick links</p>
        <div class="settings-row" role="group" aria-labelledby="links-heading">
          <button type="button" class="btn btn-ghost" id="export-links">Export JSON</button>
          <button type="button" class="btn btn-ghost" id="import-links">Import JSON</button>
          <input type="file" id="import-file" class="visually-hidden" accept="application/json,.json" tabindex="-1" aria-label="Choose a links JSON file">
        </div>
        <p class="settings-status" id="links-status" role="status" hidden></p>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="reset-links">Reset quick links</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
    <button class="dialog-close icon-btn" type="button" aria-label="Close settings" data-close>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </dialog>

  <!-- Add quick link -->
  <dialog class="dialog" id="add-dialog" aria-labelledby="add-heading">
    <h2 id="add-heading">Add quick link</h2>
    <form id="add-form" novalidate>
      <div class="field">
        <label for="link-name">Name</label>
        <input id="link-name" type="text" maxlength="30" required placeholder="Wikipedia" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="link-url">URL</label>
        <input id="link-url" type="text" inputmode="url" required placeholder="wikipedia.org" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <p class="form-error" id="add-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn">Add link</button>
      </div>
    </form>
    <button class="dialog-close icon-btn" type="button" aria-label="Close add-link dialog" data-close>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </dialog>

  <!-- APOD details -->
  <dialog class="dialog dialog-wide" id="apod-dialog" aria-labelledby="apod-heading">
    <h2 id="apod-heading"></h2>
    <p class="apod-meta" id="apod-dialog-meta"></p>
    <div class="apod-media" id="apod-media"></div>
    <p class="apod-explain" id="apod-explain"></p>
    <form class="apod-date-form" id="apod-date-form">
      <div class="field">
        <label for="apod-date">View a past day</label>
        <input type="date" id="apod-date">
      </div>
      <button type="submit" class="btn btn-ghost">Show</button>
    </form>
    <p class="form-error" id="apod-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <a class="btn btn-ghost" id="apod-hd" target="_blank" rel="noopener noreferrer" hidden>Full resolution</a>
      <button type="button" class="btn" data-close>Close</button>
    </div>
    <button class="dialog-close icon-btn" type="button" aria-label="Close picture details" data-close>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
